name: Release to PyPI

# Publishes djrhails-graphs to PyPI via Trusted Publishing (OIDC) — no token; the
# runner mints a short-lived OIDC token PyPI exchanges via the pre-registered
# publisher. Two idempotent triggers (a version already on PyPI is skipped):
#
#   - push of a vX.Y.Z tag : build + publish that tag (the explicit release path).
#   - push to main         : if the code __version__ has no matching vX.Y.Z tag
#                            yet, create the tag and publish. This self-heals the
#                            drift where a version bump lands on main untagged —
#                            e.g. a bump folded into a squash-merged PR, which
#                            discards bumpver's branch-local tag so the release
#                            never fires (how 0.11.1/0.11.2 shipped no tag/wheel).
#
# So "the version in code" is the single source of truth: whatever version reaches
# main gets exactly one tag and one PyPI release, however the commit got there.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  release:
    name: Tag (if needed) + publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/djrhails-graphs
    permissions:
      contents: write # create the vX.Y.Z tag on the main-push self-heal path
      id-token: write # OIDC trusted publishing
    steps:
      - name: Checkout (no creds)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve version, tag, and whether to release
        id: ver
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' graphs/__init__.py)"
          [ -n "$version" ] || { echo "::error::could not read __version__ from graphs/__init__.py"; exit 1; }
          tag="v${version}"
          exists=false
          git rev-parse -q --verify "refs/tags/${tag}" >/dev/null && exists=true
          # Publish on any tag push, or on a main push whose version is not yet tagged.
          should_release=false
          if [ "${{ github.ref_type }}" = "tag" ] || [ "$exists" = "false" ]; then
            should_release=true
          fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "exists=$exists"
            echo "should_release=$should_release"
          } >> "$GITHUB_OUTPUT"
          echo "resolved version=$version tag=$tag exists=$exists should_release=$should_release"

      - name: Create tag on main-push self-heal
        if: steps.ver.outputs.should_release == 'true' && steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/${{ steps.ver.outputs.tag }}" \
            -f sha="${{ github.sha }}"
          echo "created ${{ steps.ver.outputs.tag }} at ${{ github.sha }}"

      - name: Set up Python
        if: steps.ver.outputs.should_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build backend
        if: steps.ver.outputs.should_release == 'true'
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        if: steps.ver.outputs.should_release == 'true'
        run: python -m build

      - name: Verify dist
        if: steps.ver.outputs.should_release == 'true'
        run: ls -la dist/

      - name: Publish to PyPI
        if: steps.ver.outputs.should_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Idempotent: a re-run (or the redundant main-push run that pairs with a
          # tag push) is a no-op once the version is on PyPI.
          skip-existing: true
