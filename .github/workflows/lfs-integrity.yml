name: LFS integrity

# Guards against the failure mode where a committed LFS pointer has no backing
# blob on the LFS remote. When that happens, every fresh clone — including any
# downstream `uv sync` that pins djrhails-graphs as a git dependency — aborts
# with "smudge filter lfs failed: remote missing object <oid>" (this hit
# examples/affordability_chart.png in July 2026). `git lfs fetch --all` asks
# the server for every object reachable from every ref, so a pointer whose
# blob was never uploaded (or was lost server-side) fails the build here
# instead of in a consumer's install.
#
# Runs on PRs (catches a pointer committed without its blob before merge),
# pushes to main and tags (the refs downstreams pin), and weekly (catches
# server-side loss with no accompanying push).

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify-lfs-objects:
    name: Every LFS pointer has a blob on the remote
    # taffy's self-hosted pool — GitHub-hosted minutes are billed. This repo is
    # PUBLIC and this workflow runs on pull_request, so a pull request from a
    # FORK is kept on GitHub-hosted runners: a fork PR can run arbitrary code,
    # which must never reach taffy. Same-repo PRs, pushes, the weekly cron and
    # manual dispatches are all trusted and use the pool.
    # Escape hatch: set the CI_FALLBACK repo variable to 'true'.
    runs-on: >-
      ${{ (github.event.pull_request.head.repo.fork || vars.CI_FALLBACK == 'true')
      && 'ubuntu-latest'
      || fromJSON('["self-hosted", "linux", "x64", "taffy"]') }}
    steps:
      - name: Checkout (pointers only, no creds)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: false

      - name: Fetch every LFS object reachable from any ref
        run: |
          set -euo pipefail
          git lfs fetch --all origin

      - name: Verify HEAD and all tags resolve to local objects
        run: |
          set -euo pipefail
          missing=0
          for ref in HEAD $(git tag); do
            while read -r oid _marker path; do
              obj=".git/lfs/objects/${oid:0:2}/${oid:2:2}/${oid}"
              if [ ! -f "$obj" ]; then
                echo "::error::LFS object ${oid} for ${path} at ${ref} is missing from the remote"
                missing=1
              fi
            done < <(git lfs ls-files --long "$ref")
          done
          exit "$missing"
